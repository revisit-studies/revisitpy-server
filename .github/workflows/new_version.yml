name: Create a new version and push to PyPi and GitHub

on:
  repository_dispatch:
    types: [study_repo_publish]
  workflow_dispatch:
    inputs:
      study_tag:
        description: "Released study tag (vX.Y.Z); supplies assets and package major/minor"
        required: true
        type: string
      release_version:
        description: "Optional exact X.Y.Z package version in the same major/minor series"
        required: false
        type: string

concurrency:
  group: revisitpy-server-publish
  cancel-in-progress: false

jobs:
  create_version:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PAT }}

      - name: Resolve study release tag
        env:
          STUDY_TAG: ${{ github.event.client_payload.release_tag || inputs.study_tag }}
        run: |
          [[ "$STUDY_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "A release_tag / study_tag in vX.Y.Z form is required"; exit 1; }
          echo "STUDY_TAG=$STUDY_TAG" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: revisit-studies/study
          ref: refs/tags/${{ env.STUDY_TAG }}
          path: study

      - name: Change VITE_BASE_PATH env variable
        run: |
          sed -i -E 's/^VITE_BASE_PATH="\/study\/"/VITE_BASE_PATH="\/"/' study/.env

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "yarn"
          cache-dependency-path: study/yarn.lock

      - name: Install study dependencies
        run: yarn --cwd=./study install --immutable

      - name: Build with .env file
        run: yarn --cwd=./study build

      - name: Copy new study docs to docs and cleanup
        run: |
          git rm -r src/revisitpy_server/static/
          mkdir src/revisitpy_server/static/
          cp -vr study/dist/* src/revisitpy_server/static/

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Update pyproject.toml version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python scripts/set_release_version.py --study-tag "$STUDY_TAG" --version "$RELEASE_VERSION"

      - name: Update lockfile version
        run: uv lock

      - name: Hatch Install
        run: |
          uv venv
          uv pip install hatch

      - name: Hatch Build
        run: |
          rm -rf study
          uv run hatch build

      - name: Commit and push changes
        run: |
          git config --global user.email "jackwilburn@tutanota.com"
          git config --global user.name "Jack Wilburn"
          git add pyproject.toml uv.lock src
          if ! git diff --cached --quiet; then
            git commit -m "Create a new version based on the latest tag"
          fi
          git push origin HEAD:main

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
